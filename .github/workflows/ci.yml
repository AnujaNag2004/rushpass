name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rushpass
          POSTGRES_PASSWORD: rushpass
          POSTGRES_DB: rushpass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rushpass" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rushpass:rushpass@localhost:5432/rushpass_test
      TEST_DATABASE_URL: postgresql://rushpass:rushpass@localhost:5432/rushpass_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (includes the 50-parallel-requests double-booking test)
        run: npm test
      - name: Build
        run: npm run build
